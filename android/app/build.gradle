plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def ltobankApiKey = localProperties.getProperty('ltobank.api.key') ?: ""
def ltobankProjectId = localProperties.getProperty('ltobank.project.id') ?: ""

android {
    namespace "com.antigravity.ltobank"
    compileSdk 34
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.antigravity.ltobank"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 54
        versionName "1.0.0"
        multiDexEnabled true
        
        // 🛡️ [SECURITY] 로컬 파일에서 읽어온 키를 리소스에 주입
        resValue "string", "ltobank_api_key", ltobankApiKey
        resValue "string", "ltobank_project_id", ltobankProjectId
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "androidx.work:work-runtime-ktx:2.8.1"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging-ktx'
}
